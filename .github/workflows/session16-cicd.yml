name: Session 16 - CI/CD Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APP_DIR: 16-cicd-github-actions

defaults:
  run:
    working-directory: 16-cicd-github-actions

jobs:
  build-and-test:
    name: CI - Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests (JUnit report + console)
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter-destination=stdout \
                      --test-reporter=junit --test-reporter-destination=reports/junit.xml

      - name: Build app bundle
        run: |
          mkdir -p dist
          cp -r app package.json dist/
          echo "commit: ${{ github.sha }}"  > dist/build-info.txt
          echo "run:    ${{ github.run_number }}" >> dist/build-info.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ${{ env.APP_DIR }}/reports/junit.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-build
          path: ${{ env.APP_DIR }}/dist
          retention-days: 7

  docker-build:
    name: CI - Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t cicd-demo:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 3000:3000 cicd-demo:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000 | grep "Hello World"
          docker rm -f smoke

  docker-push:
    name: CD - Push Image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # registry names must be lowercase
          IMAGE=ghcr.io/$OWNER/cicd-demo
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "### Pushed \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
