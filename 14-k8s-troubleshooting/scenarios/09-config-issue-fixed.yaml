apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  APP_MODE: "prod"
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-config-pod
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo running in $APP_MODE mode; sleep 3600"]
    env:
    - name: APP_MODE
      valueFrom:
        configMapKeyRef:
          name: shop-config
          key: APP_MODE
