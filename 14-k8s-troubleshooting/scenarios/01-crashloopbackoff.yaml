apiVersion: v1
kind: Pod
metadata:
  name: crashy
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "app starting..."
      if [ -z "$APP_CONFIG" ]; then echo "FATAL: APP_CONFIG is not set" >&2; exit 1; fi
      echo "config = $APP_CONFIG, app running"
      sleep 3600
