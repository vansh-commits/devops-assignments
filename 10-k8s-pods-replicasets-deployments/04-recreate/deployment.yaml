apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
spec:
  replicas: 3
  strategy:
    type: Recreate          # delete ALL old pods first, then create the new ones
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v1
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
        ports:
        - containerPort: 80
