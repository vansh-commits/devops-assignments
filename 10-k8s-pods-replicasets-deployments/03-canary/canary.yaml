apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
spec:
  replicas: 1                  # 1 of 10 pods -> ~10% of traffic
  selector:
    matchLabels:
      app: web-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: web-canary-demo   # same label as stable, so the Service picks it up too
        track: canary
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        command: ["sh", "-c", "echo 'CANARY v2' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
