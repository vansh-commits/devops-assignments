apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo hello-from-pod > /node-data/pod-file.txt; sleep 3600"]
    volumeMounts:
    - name: node-vol
      mountPath: /node-data
  volumes:
  - name: node-vol
    hostPath:
      path: /tmp/hostpath-demo
      type: DirectoryOrCreate
