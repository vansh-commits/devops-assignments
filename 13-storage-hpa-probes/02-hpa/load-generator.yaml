apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  containers:
  - name: load
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      for i in 1 2 3 4; do
        (while true; do wget -q -O- http://hpa-app.default.svc.cluster.local > /dev/null; done) &
      done
      wait
