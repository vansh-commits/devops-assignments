apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vansh-commits/devops-assignments.git
    targetRevision: main
    path: 20-monitoring-observability-gitops/03-gitops/gitops-repo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true     # delete resources that were removed from Git
      selfHeal: true  # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
