apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  labels:
    app: cpu-stress
spec:
  containers:
    - name: stress
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting cpu burn'; while true; do :; done"]
      resources:
        requests:
          cpu: 100m
          memory: 16Mi
        limits:
          cpu: 500m
          memory: 64Mi
