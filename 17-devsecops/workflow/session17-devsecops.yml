name: Session 17 - DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: 17-devsecops
  IMAGE_NAME: devsecops-demo

defaults:
  run:
    working-directory: 17-devsecops

permissions:
  contents: read

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile sources (catches syntax errors)
        run: python -m compileall -q app

  unit-test:
    name: 2. Unit Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/test-results.xml

  sast:
    name: 3. SAST (Bandit)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit static analysis (fails on MEDIUM/HIGH)
        run: bandit -c security/bandit.yaml -r app -ll

  sca:
    name: 4. SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Check dependencies for known CVEs
        run: pip-audit -r requirements.txt --strict --desc

  secret-scan:
    name: 5. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/scan" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /scan --config /scan/security/.gitleaks.toml --redact --verbose

  docker-build:
    name: 6. Docker Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t $IMAGE_NAME:${{ github.sha }} .
      - name: Save image so later jobs scan and push the SAME image
        run: docker save $IMAGE_NAME:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ env.APP_DIR }}/image.tar
          retention-days: 1

  image-scan:
    name: 7. Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ env.APP_DIR }}
      - run: docker load -i image.tar
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Scan image (human readable table)
        run: trivy image --config security/trivy.yaml --exit-code 0 $IMAGE_NAME:${{ github.sha }}
      - name: Scan image (JSON report for the gate)
        run: trivy image --config security/trivy.yaml --exit-code 0 -f json -o trivy-report.json $IMAGE_NAME:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ env.APP_DIR }}/trivy-report.json

  security-gate:
    name: 8. Security Gate
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: ${{ env.APP_DIR }}
      - name: Block the release if fixable HIGH/CRITICAL CVEs or secrets were found
        run: |
          VULNS=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          SECRETS=$(jq '[.Results[]?.Secrets[]?] | length' trivy-report.json)
          echo "HIGH/CRITICAL fixable vulnerabilities: $VULNS"
          echo "Secrets inside image: $SECRETS"
          {
            echo "### Security Gate"
            echo "| Check | Found |"
            echo "|---|---|"
            echo "| HIGH/CRITICAL CVEs (fixable) | $VULNS |"
            echo "| Secrets in image | $SECRETS |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VULNS" -gt 0 ] || [ "$SECRETS" -gt 0 ]; then
            echo "::error title=Security Gate::FAILED - image will NOT be pushed"
            exit 1
          fi
          echo "::notice title=Security Gate::PASSED"

  push-image:
    name: 9. Push Image (GHCR)
    runs-on: ubuntu-latest
    needs: security-gate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ env.APP_DIR }}
      - run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & push the scanned image
        id: push
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE=ghcr.io/$OWNER/$IMAGE_NAME
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: 10. Deploy to Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: push-image
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: devsecops
      - name: Pull the image from GHCR and load it into kind
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ${{ needs.push-image.outputs.image }}
          kind load docker-image ${{ needs.push-image.outputs.image }} --name devsecops
      - name: kubectl apply
        run: |
          sed "s|image: devsecops-demo:local|image: ${{ needs.push-image.outputs.image }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/devsecops-demo --timeout=120s
          kubectl get deploy,pods,svc -o wide
      - name: Smoke test
        run: |
          kubectl port-forward svc/devsecops-demo 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ && echo   # echo adds the missing newline so the log shows the page
