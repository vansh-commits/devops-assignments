apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
data:
  DB_USER: ZGVtby11c2Vy
  DB_PASS: bm90LWEtcmVhbC1wYXNzd29yZA==
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: app
    image: nginx:alpine
    command: ["sleep", "3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_USER
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: DB_PASS
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/db-secret
      readOnly: true
  volumes:
  - name: secret-vol
    secret:
      secretName: db-secret
